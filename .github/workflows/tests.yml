name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic daily data for CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path.cwd()
          processed = root / "data" / "processed"
          processed.mkdir(parents=True, exist_ok=True)

          rows = []
          for day in range(1, 32):
              count = (
    1000
    + day * 37
    + (day % 5) * 23
    + (day % 3) * 11
    + ((day * day) % 17) * 19
    + ((day * 7) % 11) * 31
)
              amount = float(count * (120 + day))

              rows.append({
                  "day_index": day,
                  "transaction_count": count,
                  "total_amount": amount,
                  "average_amount": amount / count,
              })

          pd.DataFrame(rows).to_csv(
              processed / "daily_activity.csv",
              index=False,
          )

          print("Created deterministic synthetic daily data for CI.")
          PY

      - name: Generate baseline forecast outputs
        run: python src/evaluation/compare_baselines.py

      - name: Generate anomaly monitoring outputs
        run: python src/monitoring/forecast_anomaly_monitor.py

      - name: Run test suite
        run: python -m pytest tests -v
